<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClassAttend</title>
    <!-- GitHub Pages 404s any deep link on hard refresh (no server-side
         rewrites). This packs the real path into a query string and
         redirects to the app root, which unpacks it -- see the matching
         script in index.html. https://github.com/rafgraph/spa-github-pages -->
    <script>
      var pathSegmentsToKeep = 1; // keep "/classattend-web"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
